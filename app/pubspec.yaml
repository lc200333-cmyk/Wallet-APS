name: wallet_aps
description: "Wallet APS: локальный менеджер паролей, заметок и карточек."
publish_to: "none"
# Application version updates and release builds are managed by the Release workflow.
version: 0.4.4+49

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  archive: ^4.0.9
  flutter:
    sdk: flutter
  file_picker: ^10.3.10
  image: ^4.9.1
  path_provider: ^2.1.5
  pointycastle: ^3.9.1
  sqlite3: ^2.7.6
  sqlite3_flutter_libs: ^0.5.32

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/branding/wallet_android.png
    - assets/branding/attachment_arrow.png
    # All SPB Wallet card, folder and UI pictograms are packed into one
    # non-media asset so Android gallery applications cannot index them.
    - assets/spb_icons.bundle
    # User-provided third-party icon library, kept in one non-media archive.
    - assets/third_party/NewIcons.zip
    # Original template library. Legacy databases refer to stable identities.
    - assets/spb_wallet_libraries/templates/
    # Base wallet used when the user creates a new encrypted .swl database.
    - assets/base_wallet/MyWallet.swl
