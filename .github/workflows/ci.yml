name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.7'

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.4'
          cache: false
      - name: Prepare logs
        run: mkdir -p dist/ci
      - name: Validate workflow syntax
        shell: bash
        run: |
          set -o pipefail
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= 2>&1 | tee dist/ci/workflow.log
      - name: Packaging checks
        shell: bash
        run: |
          set -o pipefail
          npm ci
          npm test 2>&1 | tee dist/ci/packaging.log
      - name: Resolve locked Flutter dependencies
        working-directory: app
        run: flutter pub get --enforce-lockfile
      - name: Check changed Dart formatting
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          set -o pipefail
          BASE="${PR_BASE:-$PUSH_BASE}"
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then BASE="$(git rev-parse HEAD^)"; fi
          dart tools/check_changed_format.dart "$BASE" 2>&1 | tee dist/ci/format.log
      - name: Analyze
        working-directory: app
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --no-pub 2>&1 | tee ../dist/ci/analyze.log
          dart analyze ../tools/check_changed_format.dart ../tools/check_dependencies.dart 2>&1 | tee ../dist/ci/scripts-analyze.log
      - name: Tests and coverage
        working-directory: app
        shell: bash
        run: |
          set -o pipefail
          flutter test --no-pub --coverage --reporter expanded --file-reporter json:../dist/ci/flutter-tests.json 2>&1 | tee ../dist/ci/tests.log
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-results
          path: |
            dist/ci/
            app/coverage/lcov.info
          retention-days: 14

  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Audit hosted Pub dependencies against OSV
        shell: bash
        run: |
          set -o pipefail
          mkdir -p dist/ci
          dart tools/check_dependencies.dart 2>&1 | tee dist/ci/dependencies.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit
          path: dist/ci/
          retention-days: 14

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows
            artifact: app/build/windows/x64/runner/Release/
          - os: ubuntu-24.04
            target: linux
            artifact: app/build/linux/x64/release/bundle/
          - os: ubuntu-24.04
            target: apk
            artifact: app/build/app/outputs/flutter-apk/app-debug.apk
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - uses: actions/setup-java@v4
        if: matrix.target == 'apk'
        with:
          distribution: temurin
          java-version: '17'
      - name: Linux build libraries
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libwebp-dev libglu1-mesa
      - name: Locked dependencies
        working-directory: app
        run: flutter pub get --enforce-lockfile
      - name: Compile application (no publication)
        working-directory: app
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -o pipefail
          mkdir -p ../dist/ci
          MODE=release
          if [[ "$TARGET" == apk ]]; then MODE=debug; fi
          flutter build "$TARGET" "--$MODE" --no-pub 2>&1 | tee ../dist/ci/build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-${{ matrix.target }}
          path: dist/ci/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: test-build-${{ matrix.target }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
