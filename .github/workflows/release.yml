name: Release
run-name: Release from ${{ github.ref_name }} @ ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump: patch, minor, major, or explicit x.y.z"
        required: false
        default: "patch"
  push:
    branches: [ master ]
    paths:
      - "app/**"
      - "tools/**"
      - "tests/**"
      - "docker/**"
      - ".dockerignore"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/release.yml"

permissions:
  contents: write

# Serialize releases so each run bumps the version produced by the previous run.
concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify packaging
        run: npm test
      - name: Resolve Flutter dependencies
        working-directory: app
        run: flutter pub get
      - name: Analyze Flutter
        working-directory: app
        run: flutter analyze
      - name: Test Flutter
        working-directory: app
        run: flutter test

  version:
    needs: verify
    if: github.event_name == 'workflow_dispatch' || (github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip release]'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Bump version
        id: version
        shell: bash
        run: |
          BUMP="${{ github.event.inputs.bump || 'patch' }}"
          COMMIT_MESSAGE="$(git log -1 --pretty=%B)"
          if [[ "$COMMIT_MESSAGE" =~ \[release[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+)\] ]]; then
            BUMP="${BASH_REMATCH[1]}"
          fi
          VERSION="$(node tools/bump_version.js "$BUMP")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit and tag version
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if git show-ref --verify --quiet "refs/tags/v$VERSION"; then
            git show "v$VERSION:app/pubspec.yaml" | grep -Fq "version: $VERSION+"
            echo "Tag v$VERSION already exists with the requested app version; reusing it."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json app/pubspec.yaml app/lib/app_version.dart tools/windows/Wallet-APS.iss tools/build_linux_deb.sh
          git commit -m "chore: release v$VERSION [skip release]"
          git tag -a "v$VERSION" -m "Wallet APS v$VERSION"
          git push --atomic origin HEAD:master "refs/tags/v$VERSION"

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable

      - name: Prepare Flutter Windows
        working-directory: app
        run: flutter create --platforms=windows .

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Apply branding (name + icons)
        shell: bash
        run: tools/apply_branding.sh

      - name: Analyze Flutter app
        working-directory: app
        run: flutter analyze

      - name: Build Windows app
        working-directory: app
        run: flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build setup.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "tools\windows\Wallet-APS.iss"
          Copy-Item "dist\Wallet-APS-Setup-${{ needs.version.outputs.version }}.exe" "dist\Wallet-APS-Setup.exe"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: dist/Wallet-APS-Setup.exe
          retention-days: 1

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Free unused host Android SDK for Docker build
        shell: bash
        run: |
          set -euo pipefail
          # This job builds inside Docker with /opt/android-sdk, not the host SDK.
          # Remove only this known disposable runner directory, never the checkout.
          if [[ -d /usr/local/lib/android/sdk ]]; then
            SDK_PATH="$(realpath -- /usr/local/lib/android/sdk)"
            [[ "$SDK_PATH" == /usr/local/lib/android/sdk ]] || exit 1
            du -sh -- "$SDK_PATH"
            sudo rm -rf -- "$SDK_PATH"
          fi
          df -h .

      - name: Use public Ubuntu mirror
        shell: bash
        run: sed -i 's#^FROM ubuntu:#FROM mirror.gcr.io/library/ubuntu:#' docker/build-env/Dockerfile

      - name: Build release APK in Docker
        shell: bash
        run: |
          mkdir -p dist
          docker compose build build-apk
          HOST_UID="$(id -u)" HOST_GID="$(id -g)" docker compose run --rm -e BUILD_MODE=release build-apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/Wallet-APS-android.apk
          retention-days: 1

  linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Use public Ubuntu mirror
        shell: bash
        run: sed -i 's#^FROM ubuntu:#FROM mirror.gcr.io/library/ubuntu:#' docker/linux-deb/Dockerfile

      - name: Build deb in Docker
        shell: bash
        run: |
          mkdir -p dist
          docker compose build build-deb
          HOST_UID="$(id -u)" HOST_GID="$(id -g)" docker compose run --rm build-deb

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist/Wallet-APS-linux-amd64.deb
          retention-days: 1

  # Uploads iOS and macOS builds to TestFlight. Not a dependency of `publish`,
  # so an Apple-side problem never blocks the GitHub release.
  apple:
    needs: version
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      FLUTTER_VERSION: '3.44.7'
      BUNDLE_ID: com.lc200333cmyk.walletaps
      TESTFLIGHT_GROUP: Публичная ссылка
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Prepare Flutter project
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          dart run tool/generate_apple_icons.dart
          flutter build ios --release --config-only --no-pub
          flutter build macos --release --config-only --no-pub
          BUILD_NUMBER="$(sed -n 's/^version: [^+]*+\([0-9]*\)$/\1/p' pubspec.yaml)"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

      # Archives are built without a signing identity; the export step signs
      # them with Apple's cloud-managed distribution certificate via the API
      # key. The macOS archive gets an ad-hoc signature so that its sandbox
      # entitlements survive into the exported package.
      - name: Upload iOS build
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ios.xcarchive" \
            CODE_SIGNING_ALLOWED=NO archive
          ../tools/apple/upload_archive.sh "$RUNNER_TEMP/ios.xcarchive" "$RUNNER_TEMP/ios-export"

      # arm64 only: Flutter 3.44.7 fails to verify universal engine binaries
      # with the lipo shipped in newer Xcode releases.
      - name: Upload macOS build
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -workspace macos/Runner.xcworkspace -scheme Runner \
            -configuration Release -archivePath "$RUNNER_TEMP/macos.xcarchive" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            archive
          ../tools/apple/upload_archive.sh "$RUNNER_TEMP/macos.xcarchive" "$RUNNER_TEMP/macos-export"

      - name: Distribute to TestFlight testers
        shell: bash
        run: |
          set -euo pipefail
          for platform in IOS MAC_OS; do
            python3 -I tools/apple/testflight_distribute.py \
              --bundle-id "$BUNDLE_ID" --platform "$platform" \
              --version "${{ needs.version.outputs.version }}" \
              --build-number "$BUILD_NUMBER" --group "$TESTFLIGHT_GROUP"
          done

      - name: Remove App Store Connect API key
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/asc"

  publish:
    needs: [version, windows, android, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Wallet APS ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: |
            release-assets/Wallet-APS-Setup.exe
            release-assets/Wallet-APS-android.apk
            release-assets/Wallet-APS-linux-amd64.deb

      - name: Keep only last 2 releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh release list --limit 100 --json tagName,isDraft,createdAt \
            --jq '[.[] | select(.isDraft == false)] | sort_by(.createdAt) | reverse | .[2:] | .[].tagName' |
          while read -r tag; do
            [ -z "$tag" ] && continue
            gh release delete "$tag" -y --cleanup-tag
          done
