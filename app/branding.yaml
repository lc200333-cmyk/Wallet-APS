# Single source of truth for cross-platform app branding.
# Change values here, then run tools/apply_branding.sh (called automatically
# by tools/build_android_apk.sh and tools/build_linux_deb.sh, and by the
# Windows CI workflows) to propagate the name/icon to every platform.
name: Wallet APS
windows_name: Wallet APS

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: assets/branding/wallet_android.png
  adaptive_icon_background: "#00000000"
  adaptive_icon_foreground: assets/branding/wallet_android.png
  adaptive_icon_foreground_inset: 20
  min_sdk_android: 21
  windows:
    generate: true
    image_path: windows/runner/resources/app_icon.source.png
    icon_size: 256
